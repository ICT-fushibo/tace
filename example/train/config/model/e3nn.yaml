config:
  _target_: tace.models.e3nnTACE # [e3nnTACE, eqtTACE, cartTACE] export TACE_USE_OEQ=1 to use openequivariance
  wrapper:
    _target_: tace.models.TensorModel # [TensorModel]

  cutoff: 6.0 # (float), recommend 6.0
  max_neighbors: null # (null, int) if you want to use tace in lammps, do not use max_neighbors
  atomic_numbers: null # (null, list), null = read from dataset.
  # fidelity:
  #   - {
  #     name: PBE, # (str) custom name
  #     # (null, Dict[int, float])
  #     atomic_energy: {1: -13.587222780835477, 6: -1029.4889999855063, 7: -1484.9814568572233, 8: -2041.9816003861047} 
  #   }

  fidelity:
    - {
      name: PBE, 
      atomic_energy: null
    }

  node_embedding: 
    type: linear    # [linear, nonlinear, surrounding, group], linear is safer

  edge_embedding: 
    type: nonlinear # identity  # [identity, linear, nonlinear, element, group], identity is safer

  edge_update:
    type: element  # [identity, element, tensor_dot], identity is safer
    tensor_dot_channel: null # [null, int] null=8

  Lmax: 2 # Truncation for node, 2 is recommended.
  lmax: 3 # Truncation for edge, 3 is recommended.
  num_layers: 3 # 2 for correlation >=3, can be higher when correlation=2
  num_channel: 48 # (int), 48~64, 64's accuracy is enough to achieve SOTA, never use channel > 64
  
  radial_basis:
    radial_basis: j0   # [j0, jn, gaussian]
    num_radial_basis: 8 # (int) 8-10 for j0 and jn, 8-64 for gaussian 
    distance_transform: null # [null, Agnesi, Soft], this plug-in from mace, if you do not know what it means, never use
    cutoff_fn: c2poly # [c2poly, c3poly, mollifier, cosine]
    polynomial_cutoff: 5 # (int)
    gaussian_width: 2.0
    order: 0 # (int), specify order for jn, for j0, it is negligible, for jn, <7 stable
    trainable: false # (bool)
    apply_cutoff: false # # (bool) true: cutoff was use in before radial_mlp, false: after radial_mlp
    hidden: [64, 64] # list(int)
    bias: true  # (bool)
    use_dydynamic_cutoff: false # in test
    dydynamic_cutoff_mu: 40     # in test
   
  resnet: 
    type: BB # [BB, AB, AttnRes] A = atomic_basis, B = product_basis, control how resnet connect
    linear_type: aware # [aware, agnostic]
    use_first_resnet: false

  atomic_basis:
    type: cgtp # [cgtp]
    l1l2: null # [null, <=], restriction for each layer
    ictp_ictc_like: true # always true (cueq not support true, need modify source code)
    scatter_norm: avg_num_neighbors  # [avg_num_neighbors, density] density are from mace
    nonlinear: sigmoid_gate # [null, sigmoid_gate, sigmoid_norm, silu_grid]
    edge_info_type: mlp # [mlp, glu]
      
  product_basis:
    type: cgtp  # [cgtp, mtp, gtp, nonlinear, identity, agnostic]
    l1l2: null  # [null, <=]
    ictp_ictc_like: true
    correlation: 2 # (int) 3 is recommended for 2 layer, 2 is  is recommended for > 2 layer
    num_channel: null # (int)
    # below only useful for type=gtp
    num_latitude: null
    num_longitude: null
    truncation: ${model.config.lmax}
    trainable_scale: false
    # below only useful for type=nonlinear
    nonlinear: sigmoid_gate # [null, sigmoid_gate, sigmoid_norm]

  readout_emlp:
    bias: false
    hidden: [16]
    use_alllayer: false # (bool) recommended true, if true, evergy layer has readout, else, only last layer has
    use_uie: false
   
  scale_shift:
    scale_type: rms_forces_by_element # [null, rms_forces, rms_forcesrms_forces_by_element]
    shift_type: null # [null, mean_delta_energy_per_atom, forces, mean_delta_energy_per_atom_by_element]
    scale_trainable: false # (bool) 
    shift_trainable: false # (bool) 

  short_range:
    zbl: # metal units
      enable: true    # recommended true
      trainable: false # recommended always false

  long_range:
    les: # for introduction to the arguments, see the official repo: https://github.com/ChengUCB/les
      enable: false
      les_arguments:
        n_layers: 3
        n_hidden: [32, 16]
        add_linear_nn: true
        output_scaling_factor: 0.1
        sigma: 1.0
        dl: 2.0
        remove_self_interaction: true
        remove_mean: true
        epsilon_factor: 1.0
        use_atomwise: false
        compute_bec: false
        bec_output_index: null

  universal_embedding: 
    charges:
      enable: false

    total_charge:
      enable: false

    spin_multiplicity:
      enable: false
      num_embeddings: 3 # (int) 

    electric_field:
      enable: false
      normalizer: 1.0 # (float)

    magnetic_field:
      enable: false
      normalizer: 1.0 # (float)

    initial_noncollinear_magmoms:
      enable: false
      normalizer: 1.0 # (float)

  special: # this field can be thoroughly ignored if you only interested in E/F/S training
  
    charges:
      method: lagrangian # [lagrangian, uniform_distribution]

    hessians:
      num_samples: 2 # traing E/F/Hessian, for each graph, <= num_samples atoms's hessians will be used to train
