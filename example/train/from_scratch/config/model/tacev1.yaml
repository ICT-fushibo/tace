config:
  _target_: tace.models.TACEV1 # only TACEV1 are avaliable now
  wrapper:
    _target_: tace.models.WrapModelV1 # only WrapModelV1 are avaliable now

  cutoff: 5.0
  max_neighbors: null # if set to null, it means no restrictions.
  atomic_numbers: null # if set to null, auto read from dataset.
  atomic_energies: # null for auto caculate, list of dict for each computational level # TODO in default
    - {1: -13.587222780835477, 6: -1029.4889999855063, 7: -1484.9814568572233, 8: -2041.9816003861047}
  num_levels: 1 # TODO in default
  use_multi_head: false
  use_multi_fidelity: false

  Lmax: 2 # (int | list) Truncation for node, 0-2 is recommended, 3 when lmax = 4
  lmax: 3 # (int | list) Truncation for edge, 3 is recommended, 2 for higher speed, if 4, restrict l1 <= l2
  num_layers: 2 # 2 is always recommended
  bias: true # use different systems with caution, false is more safe, but true may give better results
  num_channel: 64 # 64's accuracy is enough to achieve SOAT, recommended value is 64, for small number of parameters, use 48
  num_channel_hidden: ${model.config.num_channel} # should be <= num_channel, equal is the best

  radial_basis:
    radial_basis: j0   # [j0, jn, normalized_bessel]
    num_radial_basis: 8 # 8-10 is recommended
    # distance_transform: Agnesi # [Agnesi, Soft], this plug-in from mace, if you do not know what it means, never use
    distance_transform: null
    polynomial_cutoff: 5
    order: 0 # specify order for jn, for j0, it is negligible, for jn, you should use float64
    trainable: false
    apply_cutoff: true # whether use cutoff in radil basis or contraction, true is in radial basis

  angular_basis:
    traceless: true # always set this to true
    norm: true      # always set this to true

  radial_mlp:
    hidden:  [64 ,64, 64, 1024] # (list | list(list)), [64, 64, 64] for efficiency
    act: 'silu' # for rank = 0 
    gate: 'silu' # for rank > 0 
    bias: false
    enable_layer_norm: false # if inter.add_source_target_embedding = True else False

  inter:
    kernel: scatter # scatter | torch_fusion
    # restriction for each layer
    l1l2: null # null or <= (str | list)
    ictp_lw: false
    ictc_lw: false
    ictp_hw: true
    ictc_hw: true
    residual: false # false is recommended
    add_source_target_embedding: false # cat extra source_target embedding to edge_feats
    normalizer: 
      type: fixed # fixaed or dynamic
      hidden: [64]
      act_1: 'silu'
      act_2: 'tanh'
      bias: false
      scale_shift_trainable: true # only useful for dynamic

  prod:
    kernel: scatter
    ictp_lw: false
    ictc_lw: false
    ictp_hw: true
    ictc_hw: true
    l1l2: null  # null or <= (str | list)
    l3l1: null  # null, <= or == (str | list)
    correlation: 3 # (int | list), body-order    
    # The following three parameters manage the truncated part of prod foe each layer, 
    # must <= lmax for each layer. For most cases, it can be ignored.
    # max_left: 
    #   - [3, 3, 3]
    #   - [3, 3, 3] 
    # max_right: ${model.config.prod.max_left}
    # max_hidden: ${model.config.prod.max_left}
    element_aware: true # always set this to true
    # coupled_channel: true # always set this to true
    coupled_channel: true
      # - {0: true, 1: true, 2: true, 3: true}
      # - {0: true, 1: true, 2: true, 3: true}

  readout_emlp:
    hidden: [16] # 16 is enough
    act: silu # silu is recommended
    gate: silu # silu is recommended
    bias: false # false is recommended, only useful for rank-0 tensor
    use_nolinear_tensor_readout: true
    
  scale_shift:
    scale_type: rms_forces # add ``by_element`` can scale for each element
    shift_type: mean_delta_energy_per_atom # add ``by_element`` can shift for each element,  for energy only, set ``null`` or ``std_energy``
    scale_trainable: false
    shift_trainable: false
    scale_dict: auto
    shift_dict: auto

  short_range:
    use_zbl: false # whether enable near-nuclear repulsion, for practical application, true is recommended

  long_range:
    les: # for an introduction to the arguments, see the official repo: https://github.com/ChengUCB/les
      use_les: false
      les_arguments: null # If you want to use LES but are not sure how to set the arguments, just set this to null to use the default values
      # les_arguments:
