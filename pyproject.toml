[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TACE"
version = "0.2.0"
description = "TACE - ST and ICT based equivariant atomistic model."
authors = [{ name = "Zemin Xu", email = "xv_chana@163.com" }]

requires-python = ">=3.9"
dependencies = [
    "torch>=2.4,<=2.11",
    "torch_geometric>=2.4",
    "lightning",
    "omegaconf",
    "hydra-core>=1.3",
    "matscipy",
    "ase",
    "numpy",
    "e3nn",
    "scipy",
    "configargparse",
    "pandas",
    "lmdb",
    "huggingface_hub",
    #  "wandb",
]

[project.optional-dependencies]

oeq = [
    "openequivariance",
]

torchsim = [
    "torch-sim-atomistic>=0.5.2",
]
 
cueq12 = [
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu12",
]

cueq13 = [
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu13",
]

openmm = [
    "openmm",
    "openmm-ml",
    "openmmtorch",
    # conda install -c conda-forge nnpops
]

lammps = [
    "lammps",
    "cython",
    "cupy-cuda12x",
]

d3 = [
    "torch_dftd",
]

nl = [
    "ase",
    "matscipy",
    "vesin",
]

[project.urls]
Homepage = "https://github.com/xvzemin/tace"

[project.scripts]
tace-train = "tace.scripts.train:main"
tace-eval = "tace.scripts.eval:main"
tace-clean = "tace.scripts.clean:main"
tace-split = "tace.scripts.split:main"
tace-export = "tace.scripts.export:main"
tace-graph = "tace.scripts.graph:main"
tace-update = "tace.scripts.update:main"
tace-modify = "tace.scripts.modify:main"
tace-finetune = "tace.scripts.finetune:main"
tace-convert = "tace.scripts.convert:main"
tace-download = "tace.scripts.download:main"
tace-average = "tace.scripts.average:main"
tace-copy = "tace.scripts.copy:main"
tace-uspex-relax = "tace.interface.uspex.relax:main"

[tool.setuptools.packages.find]
include = [
    "tace", 
    "tace.*", 
]

[tool.setuptools.package-data]
"tace.utils" = ["*.yaml"]
# "tace.models.so2" = ["Jd.pt"]
